<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BEE2F4">
<title>moodrobe</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="moodrobe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#73BDE0; --sky-d:#2F7FA8; --sky-t:#DDF0F9; --sky-l:#BEE2F4;
  --milk:#F5F1E8; --char:#3C4654; --char2:#262D37; --muted:#5E6876; --warn:#C0625A;
  --disp:"Archivo","IBM Plex Sans Thai",sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"IBM Plex Sans Thai","Archivo",system-ui,sans-serif;
  --pad:clamp(16px,4vw,40px);
  --card-sh:0 18px 40px -24px rgba(47,127,168,.6);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);color:var(--char2);font-size:15px;line-height:1.55;padding-bottom:110px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,#BEE2F4 0px,#DDF0F9 380px,#F5F1E8 900px,#F5F1E8 100%);background-color:var(--milk);min-height:100vh;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
a{color:inherit}
::selection{background:var(--sky);color:var(--char2)}

/* sky decorations */
.spark{position:absolute;color:#fff;text-shadow:0 0 18px #fff,0 0 4px var(--sky);pointer-events:none;animation:twinkle 3.2s ease-in-out infinite;line-height:1}
@keyframes twinkle{50%{opacity:.35;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){.spark{animation:none}}

/* type */
.x{font-family:var(--disp);font-stretch:125%;font-weight:900;letter-spacing:-.04em;line-height:.9}
.it{font-family:var(--serif);font-style:normal;font-weight:400;letter-spacing:0}
.lbl{font-family:var(--disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.muted{color:var(--muted)}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad);position:relative;z-index:1}

/* header */
header{position:relative;z-index:30}
.hwrap{max-width:1200px;margin:0 auto;padding:18px var(--pad);display:flex;align-items:center;gap:14px}
.brand{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:26px;letter-spacing:-.05em;line-height:1;cursor:pointer;user-select:none}
nav{display:flex;gap:4px;background:rgba(255,255,255,.78);padding:5px;border-radius:999px;box-shadow:0 8px 24px -10px rgba(47,127,168,.35);margin-left:auto}
nav button{border:0;background:none;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;transition:background .2s,color .2s}
nav button .ic{display:none}
nav button:hover{color:var(--char2)}
nav button.on{background:var(--char2);color:#fff}
.menu-btn{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.78);box-shadow:0 8px 24px -10px rgba(47,127,168,.35);cursor:pointer;flex:none;display:grid;place-items:center;padding:0;color:var(--char2)}
.menu-btn svg{fill:currentColor;pointer-events:none}
@media (max-width:820px){
  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));margin:0;background:rgba(255,255,255,.96);box-shadow:0 14px 40px -12px rgba(38,45,55,.4);z-index:45}
  nav button{flex-direction:column;gap:1px;padding:7px 14px;font-size:11px}
  nav button .ic{display:block;width:20px;height:20px;margin-bottom:2px}
  nav .ic-hole{fill:#fff}
  nav button.on .ic-hole{fill:var(--char2)}
  .menu-btn{margin-left:auto}
}

/* hero */
.hero{text-align:center;padding:clamp(30px,6vw,64px) 0 clamp(20px,3vw,30px);position:relative}
.hero h1{margin:0;font-size:clamp(50px,11.5vw,150px);text-transform:uppercase;color:transparent;-webkit-text-stroke:2px var(--char2)}
.hero h1 .fill{color:var(--char2);-webkit-text-stroke:0}
.hero .tag{display:block;font-size:clamp(24px,3.4vw,40px);color:var(--sky-d);margin-top:10px}
.hero p{margin:10px auto 22px;max-width:760px;color:var(--muted);text-wrap:balance}
.hero .acts{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{border:0;display:inline-flex;gap:8px;align-items:center;padding:13px 24px;border-radius:999px;background:var(--char2);color:#fff;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:0 12px 30px -10px rgba(38,45,55,.55);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.w{background:#fff;color:var(--char2);box-shadow:0 10px 26px -12px rgba(47,127,168,.5)}
.btn.sm{padding:7px 14px;font-size:12.5px;box-shadow:none}
.btn.w.sm{border:1px solid rgba(60,70,84,.15)}
.bub{border:0;display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:999px;background:var(--sky);color:var(--char2);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:0 12px 30px -10px rgba(47,127,168,.7);transition:transform .15s,background .2s}
.bub:hover{transform:translateY(-2px);background:#86C8E8}
.bub:active{transform:translateY(1px)}
.lnk{border:0;background:none;padding:0;cursor:pointer;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lnk.warn{color:var(--warn)}

/* month switcher pill */
.mpill{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:5px;box-shadow:0 10px 26px -12px rgba(47,127,168,.5)}
.mpill button{width:36px;height:36px;border-radius:50%;border:0;background:var(--sky-t);cursor:pointer;font-size:16px}
.mpill button:hover{background:var(--sky)}
.mpill b{padding:0 12px;font-size:14px;min-width:150px;text-align:center;line-height:1.25}
.mpill b small{display:block;font-weight:400;font-size:11px;color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 30px}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:rgba(255,255,255,.82);border-radius:22px;padding:16px 18px;min-width:0}
.tile .v{font-size:clamp(22px,2.6vw,30px);display:block;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.hi{background:var(--sky)}
.tile input{border:0;border-bottom:2px dashed rgba(38,45,55,.4);background:transparent;width:100%;outline:none;padding:0;margin-top:8px;font-size:clamp(22px,2.6vw,30px)}
.tile input::placeholder{color:rgba(38,45,55,.45)}
.tile .it{font-size:clamp(20px,2.2vw,26px);display:block;margin-top:6px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:6px;background:rgba(255,255,255,.55);border-radius:9px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--char2);border-radius:9px}
.meter.over i{background:var(--warn)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:0;background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:0 6px 16px -10px rgba(47,127,168,.6)}
.chips button sup{font-size:10px;margin-left:3px;color:var(--muted)}
.chips button.on{background:var(--char2);color:#fff}
.chips button.on sup{color:var(--sky-l)}

/* product cards (Cloud Pop) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
@media (max-width:520px){.cards{grid-template-columns:1fr 1fr;gap:12px}}
.card{background:#fff;border-radius:26px;padding:10px;box-shadow:var(--card-sh);display:flex;flex-direction:column;transition:transform .2s;min-width:0}
.card:hover{transform:translateY(-4px)}
.card .im{aspect-ratio:1;border-radius:20px;background:radial-gradient(circle at 50% 45%,#fff 0 30%,var(--sky-t) 72%);display:grid;place-items:center;position:relative;cursor:pointer;overflow:hidden}
.card .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12%}
.card .im .ph{font-family:var(--serif);font-style:normal;font-size:22px;color:var(--muted)}
.card .tg{position:absolute;top:10px;left:10px;background:#fff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;z-index:2}
.card .tg.r{left:auto;right:10px;background:var(--char2);color:#fff}
.card .tg.ok{background:var(--sky)}
.card .row{display:flex;justify-content:space-between;gap:8px;padding:10px 6px 2px;font-size:14px;align-items:baseline}
.card .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .row b{font-family:var(--disp);font-stretch:112%;white-space:nowrap}
.card .sub{padding:0 6px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:18px}
.card .acts{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 4px 4px;margin-top:auto}
.card.done .im img{opacity:.55}
.card.done .nm{text-decoration:line-through;color:var(--muted)}
.tick{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:13px;font-weight:500}
.tick input{appearance:none;width:20px;height:20px;border:1.5px solid var(--char2);border-radius:7px;margin:0;cursor:pointer;display:grid;place-content:center;background:#fff;flex:none}
.tick input:checked{background:var(--sky)}
.tick input:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--char2);border-bottom:2px solid var(--char2);transform:rotate(-45deg) translate(1px,-1px)}

/* polaroids (Y2K) */
.pols{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:34px 26px;padding:14px 4px}
@media (max-width:520px){.pols{grid-template-columns:1fr 1fr;gap:26px 14px}}
.pol{background:#fff;padding:10px 10px 14px;box-shadow:0 18px 30px -16px rgba(38,45,55,.45);position:relative;cursor:pointer;transition:transform .25s;min-width:0}
.pol:nth-child(4n+1){transform:rotate(-3deg)}.pol:nth-child(4n+2){transform:rotate(2.5deg) translateY(10px)}.pol:nth-child(4n+3){transform:rotate(-1.5deg)}.pol:nth-child(4n+4){transform:rotate(3.5deg) translateY(6px)}
.pol:hover{transform:rotate(0) scale(1.03);z-index:2}
.pol .tape{position:absolute;top:-11px;left:50%;width:76px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(115,189,224,.6);z-index:3}
.pol .im{aspect-ratio:1;background:linear-gradient(180deg,#EAF5FB,var(--milk));display:grid;place-items:center;overflow:hidden}
.pol .im.tall{aspect-ratio:3/4}
.pol .im img{width:100%;height:100%;object-fit:cover}
.pol .im .board{width:100%;border-radius:0}
.pol .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px}
.pol .cap .it{font-size:21px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pol .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.pol .acts{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.pol .note{font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.score{display:inline-flex;align-items:baseline;gap:2px;background:var(--sky);border:1.5px solid var(--char2);border-radius:999px;padding:1px 10px;font-family:var(--disp);font-stretch:112%;font-weight:800;font-size:15px;white-space:nowrap}
.score small{font-size:11px;font-weight:600}

.empty{text-align:center;padding:40px 16px 50px}
.empty .big{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:clamp(34px,6vw,64px);letter-spacing:-.04em;line-height:.95;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px var(--char2)}
.empty .it{display:block;font-size:24px;color:var(--sky-d);margin-top:8px}
.empty p{color:var(--muted);max-width:42ch;margin:10px auto 20px;font-size:14px}
.tip{display:flex;gap:12px;align-items:center;margin-top:40px;background:rgba(255,255,255,.7);border-radius:20px;padding:14px 18px;font-size:13.5px;color:var(--muted)}
.tip .lbl{background:var(--sky);color:var(--char2);border-radius:999px;padding:3px 10px;flex:none}
.sec-h{display:flex;align-items:baseline;gap:14px;margin:60px 0 18px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:clamp(34px,5vw,60px);text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px var(--char2)}
.sec-h h2 .fill{color:var(--char2);-webkit-text-stroke:0}
.sec-h .it{font-size:24px;color:var(--sky-d)}

/* styling board */
.match{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:clamp(20px,3vw,36px);align-items:start}
@media (max-width:900px){.match{grid-template-columns:minmax(0,1fr)}}
.panel{background:rgba(255,255,255,.82);border-radius:28px;padding:18px;box-shadow:var(--card-sh);min-width:0}
.board{position:relative;aspect-ratio:3/4;background:#fff;container-type:inline-size;overflow:hidden;border-radius:20px;touch-action:none;user-select:none}
.panel .board{box-shadow:inset 0 0 0 1px rgba(60,70,84,.08)}
.board .b-title{position:absolute;top:4cqw;left:0;right:0;text-align:center;font-family:var(--serif);font-style:normal;font-size:10cqw;line-height:1;pointer-events:none;color:var(--char2)}
.board .b-date{position:absolute;top:15.5cqw;left:0;right:0;text-align:center;font-family:var(--disp);font-size:2.6cqw;letter-spacing:.5cqw;text-transform:uppercase;font-weight:600;color:var(--sky-d);pointer-events:none}
.board .deco{position:absolute;color:var(--sky);pointer-events:none;font-size:10cqw;line-height:1}
.pc{position:absolute;cursor:grab;touch-action:none}
.pc img{width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 1.4cqw 1.4cqw rgba(38,45,55,.16))}
.pc .noimg{background:var(--sky-t);border-radius:3cqw;padding:4cqw;text-align:center;font-size:3.5cqw;color:var(--muted)}
.pc .stk{display:block;line-height:1;white-space:nowrap}
.pc .stk.txt{font-family:var(--serif);font-style:normal;color:var(--sky-d)}
.pc.sel{outline:2px dashed var(--sky);outline-offset:4px;border-radius:6px}
.pc .h{position:absolute;right:-13px;bottom:-13px;width:24px;height:24px;border-radius:50%;background:var(--sky);border:2px solid var(--char2);cursor:nwse-resize}
.mini .pc{cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;min-height:38px;align-items:center}
.tools button{border:0;background:var(--sky-t);border-radius:999px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px}
.tools button:hover{background:var(--sky)}
.tools .hint{font-size:12.5px;color:var(--muted);padding:0 6px}
.fields{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:6px}
.acts-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.ph-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ph-h h3{margin:0;font-size:28px;color:var(--char2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px;max-height:360px;overflow:auto;padding:4px}
.pgrid button{aspect-ratio:1;border:0;border-radius:18px;background:radial-gradient(circle at 50% 45%,#fff 0 30%,var(--sky-t) 75%);cursor:pointer;padding:8px;position:relative;transition:transform .15s}
.pgrid button:hover{transform:scale(1.05);box-shadow:0 0 0 2px var(--sky)}
.pgrid button img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px}
.pgrid .w{position:absolute;top:4px;right:4px;background:var(--char2);color:#fff;font-size:9px;padding:1px 6px;border-radius:999px}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.stickers button{border:0;background:var(--sky-t);border-radius:14px;width:44px;height:44px;cursor:pointer;font-size:20px;transition:transform .15s}
.stickers button:hover{background:var(--sky)}
.stickers .tx{width:auto;padding:0 14px;font-family:var(--serif);font-style:normal;font-size:19px}

/* diary calendar */
.cal{background:rgba(255,255,255,.82);border-radius:28px;padding:16px;box-shadow:var(--card-sh)}
.cal .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{text-align:center;padding:4px 0;color:var(--muted)}
.day{aspect-ratio:1;border-radius:14px;background:var(--sky-t);position:relative;cursor:pointer;overflow:hidden;transition:transform .15s}
@media (min-width:900px){.day{aspect-ratio:1.45/1}}
.day:hover{transform:scale(1.04);box-shadow:0 0 0 2px var(--sky)}
.day.blank{background:transparent;cursor:default}.day.blank:hover{transform:none;box-shadow:none}
.day .n{position:absolute;top:6px;left:9px;z-index:2;font-family:var(--disp);font-stretch:112%;font-weight:700;font-size:13px}
.day.today{background:var(--char2);color:#fff}
.day.has .n{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.day img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.day .sc{position:absolute;bottom:5px;right:6px;background:var(--sky);border:1.5px solid var(--char2);color:var(--char2);font-family:var(--disp);font-weight:800;font-size:11px;padding:0 6px;border-radius:999px;z-index:2}
.day .plan{position:absolute;bottom:6px;left:8px;z-index:2;font-size:12px;color:var(--sky-d)}
.day.today .plan{color:var(--sky)}
@media (max-width:520px){.cal{padding:10px}.cal .grid7{gap:4px}.cal .dw{font-size:9px;letter-spacing:.06em}.day .n{left:6px;font-size:11px}.day{border-radius:10px}}

/* modal */
.ov{position:fixed;inset:0;background:rgba(38,45,55,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@media (min-width:640px){.ov{align-items:center}}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.modal{background:#fff;width:100%;max-width:540px;max-height:94vh;overflow:auto;border-radius:30px 30px 0 0;padding:0 0 calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:640px){.modal{border-radius:30px}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px 14px;position:sticky;top:0;background:#fff;z-index:2}
.mh h3{margin:0;font-size:24px;text-transform:uppercase}
.mb{padding:0 22px}
.x-close{width:38px;height:38px;border-radius:50%;border:0;background:var(--sky-t);cursor:pointer;font-size:20px;line-height:1;flex:none}
.x-close:hover{background:var(--sky)}
label.f{display:block;margin:16px 0 6px;color:var(--muted)}
.in,select.in,textarea.in{width:100%;border:1.5px solid transparent;background:#F1F7FB;border-radius:14px;padding:11px 14px;outline:none;font-size:15px}
.in:focus{border-color:var(--sky);background:#fff}
textarea.in{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgpick{border:2px dashed var(--sky);border-radius:20px;min-height:170px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(circle at 50% 45%,#fff 0 30%,var(--sky-t) 80%);overflow:hidden;text-align:center;color:var(--muted);font-size:13px;padding:10px;outline:none}
.imgpick .big{font-family:var(--serif);font-style:normal;font-size:26px;color:var(--char2);display:block}
.imgpick:focus{border-color:var(--sky-d)}
.imgpick img{max-height:260px;object-fit:contain;background:repeating-conic-gradient(#EEF4F8 0 25%,#fff 0 50%) 0 0/14px 14px;border-radius:10px}
.imgpick.drag{background:var(--sky-l)}
.urlrow{display:flex;gap:10px;align-items:center;margin-top:8px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:24px;flex-wrap:wrap}
.mfoot .lnk{margin-right:auto}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rate button{border:1.5px solid #DCE6EE;background:#fff;border-radius:999px;aspect-ratio:1;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:13px;padding:0;transition:transform .1s}
.rate button.on{background:var(--sky);border-color:var(--sky)}
.rate button:active{transform:scale(.9)}
.rate-lbl{margin-top:8px;min-height:26px;font-family:var(--serif);font-style:normal;font-size:21px;color:var(--sky-d)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--char2);color:#fff;padding:11px 20px;border-radius:999px;z-index:80;font-size:13.5px;animation:up .25s;white-space:nowrap;box-shadow:0 12px 30px -10px rgba(38,45,55,.6)}
.drop{position:absolute;right:var(--pad);top:74px;background:#fff;border-radius:22px;z-index:50;min-width:250px;padding:6px;box-shadow:0 20px 50px -16px rgba(38,45,55,.45)}
.drop button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;cursor:pointer;border-radius:14px}
.drop button:hover{background:var(--sky-t)}
.drop p{margin:0;padding:8px 14px;font-size:12px;color:var(--muted)}
.hide{display:none!important}
.fade{animation:fd .35s}

.dc{position:absolute;pointer-events:none;width:40px;height:auto;aspect-ratio:1;overflow:visible;z-index:2;filter:drop-shadow(0 4px 8px rgba(47,127,168,.28))}

.d-silver{--f:url(#g-chrome);--st:none;--sw:0;--snw:5;--pf:url(#g-chrome);--pfw:9;--ln:rgba(255,255,255,.95);--ink:#fff;filter:drop-shadow(0 2px 6px rgba(47,127,168,.35)) drop-shadow(0 0 3px rgba(255,255,255,.9))}

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const baht=n=>'฿'+(+n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ym=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const monthEn=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};
const monthLow=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('en-US',{month:'long'}).toLowerCase()};
const monthTh=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'})};
const shiftMonth=(k,n)=>{const [y,m]=k.split('-');return ym(new Date(+y,+m-1+n,1))};
const pd=s=>{const [y,m,d]=s.split('-');return new Date(+y,+m-1,+d)};
const fmtDate=s=>s?pd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
function toast(t){$$('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}

const CATS=[
  ['top','Tops','เสื้อ'],['outer','Outerwear','เสื้อคลุม/แจ็คเก็ต'],['dress','Dresses','เดรส'],['bottom','Bottoms','กระโปรง/กางเกง'],
  ['shoes','Shoes','รองเท้า'],['bag','Bags','กระเป๋า'],['acc','Accessories','แอคเซสซอรี่'],['socks','Socks','ถุงเท้า'],['other','Others','อื่นๆ/บิวตี้']
];
const cat=c=>CATS.find(x=>x[0]===c)||CATS[8];
const PRESET={top:{x:50,y:38,w:46},outer:{x:40,y:40,w:48},dress:{x:50,y:50,w:48},bottom:{x:50,y:67,w:42},
  shoes:{x:74,y:86,w:26},bag:{x:20,y:70,w:30},acc:{x:82,y:32,w:20},socks:{x:24,y:88,w:20},other:{x:80,y:60,w:22}};
const STICKERS=['💖','💗','💕','💘','💝','💌','💋','✨','💫','⭐','🌟','❄️','☃️','🎄','🎁','🔔','🎀','🦋','🌸','🌷','🍒','🍓','💎','💍','👑','💄','💅','👛','👠','🩰','🕶️','🧸','🐰','🐱','🍪','🧁','🍰','🍭','☕','🧋','🌙','🪩','📸','💿','📼','🎧','🫧','🌈','😉','🥰'];
const SVG_STK=[['sparkle','d-soft'],['sparkle','d-softsky'],['sparkle','d-thin'],['cluster','d-soft'],['cluster','d-softsky'],['twinkle','d-soft'],['twinkle','d-softsky'],['star','d-soft'],['star','d-softsky'],['star','d-thin'],['heart','d-soft'],['heart','d-softsky'],['heart','d-thin'],['snow','d-soft'],['snow','d-softsky'],['snow','d-thin'],['moon','d-soft'],['moon','d-softsky']];
const D=(name,v,style='',cls='')=>`<svg class="dc ${v} ${cls}" style="${style}" viewBox="0 0 100 100" aria-hidden="true"><use href="#s-${name}"/></svg>`;
const polDeco=n=>'';

/* ---------- IndexedDB ---------- */
const idb={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('moodrobe',1);
    r.onupgradeneeded=()=>{const d=r.result;['items','outfits','logs','settings'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
    r.onsuccess=()=>{idb.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(s,m,fn){return new Promise((res,rej)=>{const q=fn(idb.db.transaction(s,m).objectStore(s));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  all(s){return idb.req(s,'readonly',o=>o.getAll())},
  put(s,v){return idb.req(s,'readwrite',o=>o.put(v))},
  del(s,id){return idb.req(s,'readwrite',o=>o.delete(id))},
  clear(s){return idb.req(s,'readwrite',o=>o.clear())}
};

/* ---------- state ---------- */
const now=new Date();
const S={items:[],outfits:[],logs:[],settings:{},
  tab:'shop',month:ym(now),closetCat:'all',pickCat:'all',pickWish:false,diaryMonth:ym(now),
  edit:{id:null,name:'',date:'',pieces:[]},sel:-1};
const itemById=id=>S.items.find(i=>i.id===id);
const outfitById=id=>S.outfits.find(o=>o.id===id);
async function save(store,obj){
  const arr=S[store];const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0)arr[i]=obj;else arr.push(obj);
  try{await idb.put(store,obj)}catch(e){toast('บันทึกไม่สำเร็จ: '+e.message)}
}
async function remove(store,id){S[store]=S[store].filter(x=>x.id!==id);await idb.del(store,id)}
async function setSetting(id,value){S.settings[id]=value;await idb.put('settings',{id,value})}

/* ---------- images ---------- */
function loadImg(src,cors){return new Promise((res,rej)=>{const im=new Image();if(cors)im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src=src})}
function canvasOut(c){const w=c.toDataURL('image/webp',0.86);return w.startsWith('data:image/webp')?w:c.toDataURL('image/png')}
async function fileToData(file,max=1000){
  const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});
  const im=await loadImg(url);const s=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);return canvasOut(c);
}
// flood-fill background removal from the image edges (best on plain white / solid backgrounds)
async function removeBg(src,tol=30){
  const im=await loadImg(src,!src.startsWith('data:'));
  const s=Math.min(1,1000/Math.max(im.width,im.height));
  const w=Math.round(im.width*s),h=Math.round(im.height*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data; // throws on CORS-tainted images
  const ref=[0,(w-1)*4,((h-1)*w)*4,((h-1)*w+w-1)*4].map(k=>[p[k],p[k+1],p[k+2]]);
  const close=i=>{const k=i*4;if(p[k+3]<10)return true;return ref.some(r=>Math.abs(p[k]-r[0])+Math.abs(p[k+1]-r[1])+Math.abs(p[k+2]-r[2])<=tol*3)};
  const seen=new Uint8Array(w*h),st=[];
  for(let i=0;i<w;i++)st.push(i,(h-1)*w+i);for(let j=0;j<h;j++)st.push(j*w,j*w+w-1);
  while(st.length){const i=st.pop();if(seen[i])continue;seen[i]=1;if(!close(i))continue;p[i*4+3]=0;const cx=i%w;
    if(cx>0)st.push(i-1);if(cx<w-1)st.push(i+1);if(i>=w)st.push(i-w);if(i<w*h-w)st.push(i+w)}
  for(let i=0;i<w*h;i++){if(p[i*4+3]===0)continue;const cx=i%w;
    if((cx>0&&p[(i-1)*4+3]===0)||(cx<w-1&&p[(i+1)*4+3]===0)||(i>=w&&p[(i-w)*4+3]===0)||(i<w*h-w&&p[(i+w)*4+3]===0))p[i*4+3]=Math.min(p[i*4+3],170)}
  x.putImageData(d,0,0);
  let x0=w,y0=h,x1=-1,y1=-1;for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(p[(j*w+i)*4+3]>20){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<0)return src;
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,-x0,-y0);
  return canvasOut(o);
}

/* ---------- modal ---------- */
let modalCleanup=null;
function openModal(title,body,mount){
  closeModal();const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal" role="dialog"><div class="mh"><h3 class="x">${title}${D('sparkle','d-softsky','','inl tw')}</h3><button class="x-close" data-close aria-label="ปิด">×</button></div><div class="mb">${body}</div></div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});document.body.appendChild(ov);
  const m=$('.modal',ov);$$('[data-close]',m).forEach(b=>b.onclick=closeModal);mount&&mount(m);return m;
}
function closeModal(){const o=$('.ov');if(o)o.remove();if(modalCleanup){modalCleanup();modalCleanup=null}}

function imgPicker(m,initial,{bg=true}={}){
  let val=initial||'';const box=$('.imgpick',m),file=$('input[type=file]',box),url=$('[name=imgurl]',m),bgBtn=$('[data-bg]',m);
  const show=()=>{box.innerHTML=val?`<img src="${esc(val)}" alt="">`:`<div><span class="big">drop a photo ✦</span>แตะเพื่อเลือกรูป · วางรูปด้วย ⌘/Ctrl+V · ลากไฟล์มาวาง</div>`;box.appendChild(file);if(bgBtn)bgBtn.classList.toggle('hide',!val||!bg)};
  const setFile=async f=>{if(!f||!f.type.startsWith('image/'))return;box.innerHTML='<div>กำลังโหลดรูป…</div>';box.appendChild(file);val=await fileToData(f);url.value='';show()};
  box.onclick=()=>file.click();box.onkeydown=e=>{if(e.key==='Enter')file.click()};
  file.onchange=()=>setFile(file.files[0]);
  box.ondragover=e=>{e.preventDefault();box.classList.add('drag')};box.ondragleave=()=>box.classList.remove('drag');
  box.ondrop=e=>{e.preventDefault();box.classList.remove('drag');setFile(e.dataTransfer.files[0])};
  url.oninput=()=>{const v=url.value.trim();if(/^https?:\/\//.test(v)){val=v;show()}};
  const onPaste=e=>{const f=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(f){e.preventDefault();setFile(f.getAsFile())}};
  document.addEventListener('paste',onPaste);modalCleanup=()=>document.removeEventListener('paste',onPaste);
  if(bgBtn)bgBtn.onclick=async()=>{bgBtn.disabled=true;bgBtn.textContent='Cutting…';
    try{val=await removeBg(val);show();toast('ตัดพื้นหลังแล้ว ✂')}catch(e){toast('ตัดพื้นหลังรูปจากลิงก์ไม่ได้ ลองเซฟรูปแล้วอัปโหลดแทน')}
    bgBtn.disabled=false;bgBtn.textContent='✂ Cut background'};
  show();return()=>val;
}

  <div class="urlrow"><input class="in" name="imgurl" placeholder="หรือวางลิงก์รูปภาพ https://…" style="min-width:0;flex:1">${bg?'<button type="button" class="btn w sm hide" data-bg>✂ Cut background</button>':''}</div>`;

    <div><label class="f lbl">Shop in · เดือน</label><input class="in" name="shopMonth" type="month" value="${esc(it.shopMonth||S.month)}"></div></div>`:
    `<label class="f lbl">Price · ราคา (ไม่ใส่ก็ได้)</label><input class="in" name="price" type="number" inputmode="decimal" value="${esc(it.price)}">`}
    <label class="f lbl">Link · ลิงก์ร้าน</label><input class="in" name="link" value="${esc(it.link)}" placeholder="https://shopee… / IG / TikTok">
    <label class="f lbl">Note · โน้ต</label><textarea class="in" name="note" rows="2" placeholder="ไซซ์ M, รอลดราคา 12.12…">${esc(it.note)}</textarea>
    <div class="mfoot">${item?'<button class="lnk warn" data-del>Delete</button>':''}<button class="btn w" data-close>Cancel</button><button class="btn" data-save>Save ✦</button></div>`);

function itemCard(it,mode){
  const img=it.img?`<img src="${esc(it.img)}" alt="" loading="lazy">`:`<span class="ph">${cat(it.cat)[1]}</span>`;
  const link=it.link?`<a class="btn w sm" href="${esc(it.link)}" target="_blank" rel="noopener">Shop ↗</a>`:'';
  if(mode==='shop')return `<article class="card ${it.bought?'done':''}">
    <div class="im" data-edit="${it.id}"><span class="tg ${it.bought?'ok':''}">${it.bought?'♡ Bought':cat(it.cat)[1]}</span>${img}</div>
    <div class="row"><span class="nm">${esc(it.name)}</span><b>${it.price?baht(it.price):'—'}</b></div>
    <div class="sub">${esc(it.note)}</div>
    <div class="acts"><label class="tick"><input type="checkbox" data-buy="${it.id}" ${it.bought?'checked':''}>ซื้อแล้ว</label>${link}</div></article>`;
  const wc=wearCount(it.id);
  return `<article class="card"><div class="im" data-edit="${it.id}"><span class="tg">${cat(it.cat)[1]}</span>${wc?`<span class="tg r">worn ×${wc}</span>`:''}${img}</div>

    <div class="acts"><button class="btn sm" data-tomatch="${it.id}">Style it ✦</button>${link}</div></article>`;
}
function renderShop(){

  if(p.type==='svg')return `<div class="pc${sel?' sel':''}" data-i="${i}" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;z-index:${p.z||1};transform:${tf}"><svg class="${esc(p.v)}" viewBox="0 0 100 100"><use href="#s-${esc(p.t)}"/></svg>${sel?'<span class="h"></span>':''}</div>`;

    const it=itemById(p.itemId);if(!it)return'';
    const inner=it.img?`<img src="${esc(it.img)}" alt="" draggable="false" style="${p.f?'transform:scaleX(-1)':''}">`:`<div class="noimg">${esc(it.name)}</div>`;

}

function renderTools(){
  const t=$('#tools');if(!t)return;const p=S.edit.pieces[S.sel];
  if(!p){t.innerHTML=`<span class="hint">แตะชิ้นบนบอร์ดเพื่อปรับขนาด หมุน หรือจัดชั้น</span>`;return}
  t.innerHTML=`<button data-t="smaller" title="เล็กลง">−</button><button data-t="bigger" title="ใหญ่ขึ้น">＋</button>
  <button data-t="rl" title="หมุนซ้าย">↺</button><button data-t="rr" title="หมุนขวา">↻</button>
  ${p.type==='item'?'<button data-t="flip" title="กลับด้าน">⇆</button>':''}
  <button data-t="front">Front</button><button data-t="back">Back</button><button data-t="del" style="color:var(--warn)">Delete</button>`;
}
function redrawBoard(){const b=$('#board');if(b)b.innerHTML=boardHTML(S.edit,true);renderTools()}
function updatePiece(i){
  const el=$(`#board .pc[data-i="${i}"]`),p=S.edit.pieces[i];if(!el)return;
  el.style.left=p.x+'%';el.style.top=p.y+'%';el.style.transform=`translate(-50%,-50%) rotate(${p.r||0}deg)`;
  if(p.type==='item'||p.type==='svg')el.style.width=p.w+'%';else{const s=$('.stk',el);if(s)s.style.fontSize=p.w*0.5+'cqw'}
}
const maxZ=()=>S.edit.pieces.reduce((m,p)=>Math.max(m,p.z||1),0);
function addItemPiece(it,silent){
  const pr=PRESET[it.cat]||PRESET.other,same=S.edit.pieces.filter(p=>p.type==='item'&&itemById(p.itemId)?.cat===it.cat).length;
  S.edit.pieces.push({type:'item',itemId:it.id,x:clamp(pr.x+same*6,5,95),y:clamp(pr.y+same*4,5,95),w:pr.w,z:maxZ()+1,r:0});
  if(!silent){S.sel=S.edit.pieces.length-1;redrawBoard()}
}
function randomLook(){
  const owned=S.items.filter(i=>i.owned||(S.pickWish&&i.shopMonth)),by=c=>owned.filter(i=>i.cat===c),pick=a=>a[Math.floor(Math.random()*a.length)];
  if(!owned.length){toast('เพิ่มเสื้อผ้าเข้าตู้ก่อนนะ');return}
  S.edit.pieces=S.edit.pieces.filter(p=>p.type!=='item');
  const use=[];const dress=by('dress');
  if(dress.length&&(Math.random()<.35||!by('top').length))use.push(pick(dress));else{if(by('top').length)use.push(pick(by('top')));if(by('bottom').length)use.push(pick(by('bottom')))}
  if(by('outer').length&&Math.random()<.5)use.push(pick(by('outer')));
  ['shoes','bag'].forEach(c=>by(c).length&&use.push(pick(by(c))));
  if(by('socks').length&&Math.random()<.6)use.push(pick(by('socks')));
  use.push(...[...by('acc')].sort(()=>Math.random()-.5).slice(0,Math.random()<.5?1:2));
  use.forEach(it=>addItemPiece(it,true));S.sel=-1;redrawBoard();toast('Shuffled ✦ ไม่ชอบก็สุ่มใหม่ได้');
}
function bindBoard(){
  const b=$('#board');if(!b)return;
  b.addEventListener('pointerdown',e=>{
    const pc=e.target.closest('.pc');
    if(!pc){if(S.sel!==-1){S.sel=-1;redrawBoard()}return}
    e.preventDefault();
    const i=+pc.dataset.i,p=S.edit.pieces[i],resize=e.target.classList.contains('h');
    if(S.sel!==i){S.sel=i;redrawBoard()}
    const rect=b.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=p.x,oy=p.y,ow=p.w;
    b.setPointerCapture(e.pointerId);
    const mv=ev=>{const dx=(ev.clientX-sx)/rect.width*100,dy=(ev.clientY-sy)/rect.height*100;
      if(resize)p.w=clamp(ow+dx*2,4,130);else{p.x=clamp(ox+dx,-5,105);p.y=clamp(oy+dy,-5,105)}updatePiece(i)};
    const up=()=>{b.removeEventListener('pointermove',mv);b.removeEventListener('pointerup',up);b.removeEventListener('pointercancel',up)};
    b.addEventListener('pointermove',mv);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
  });
}
function toolAction(t){
  const ps=S.edit.pieces,p=ps[S.sel];if(!p)return;
  if(t==='bigger')p.w=Math.min(130,p.w*1.12);if(t==='smaller')p.w=Math.max(4,p.w/1.12);
  if(t==='rl')p.r=(p.r||0)-8;if(t==='rr')p.r=(p.r||0)+8;if(t==='flip')p.f=!p.f;
  if(t==='front')p.z=maxZ()+1;if(t==='back'){ps.forEach(q=>q.z=(q.z||1)+1);p.z=1}
  if(t==='del'){ps.splice(S.sel,1);S.sel=-1}
  redrawBoard();
}
async function saveLook(){
  const e=S.edit;e.name=$('#lookName').value.trim();e.date=$('#lookDate').value;
  if(!e.pieces.some(p=>p.type==='item')){toast('วางเสื้อผ้าบนบอร์ดก่อนนะ');return}
  const o={id:e.id||uid(),name:e.name,date:e.date,pieces:JSON.parse(JSON.stringify(e.pieces)),createdAt:outfitById(e.id)?.createdAt||Date.now()};
  await save('outfits',o);e.id=o.id;render();toast('Look saved ✦ บันทึกลุคแล้ว');
}
function openLook(id){const o=outfitById(id);if(!o)return;S.edit={id:o.id,name:o.name,date:o.date,pieces:JSON.parse(JSON.stringify(o.pieces))};S.sel=-1;S.tab='match';render();window.scrollTo({top:0,behavior:'smooth'})}

if(matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){let last=0;
  addEventListener('pointermove',e=>{const t=performance.now();if(t-last<70)return;last=t;const s=document.createElement('span');s.className='trail';
    s.textContent=['✦','♡','✧','⋆','♡'][Math.random()*5|0];s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.color=Math.random()<.55?'#73BDE0':'#fff';
    document.body.appendChild(s);setTimeout(()=>s.remove(),800)},{passive:true})}
const snowFx=(()=>{
  const c=document.createElement('canvas');c.id='snow';document.body.appendChild(c);const x=c.getContext('2d');
  const still=matchMedia('(prefers-reduced-motion:reduce)').matches;let W,H,flakes=[],on=false,raf=0;
  try{on=localStorage.getItem('mr-snow')!=='off'}catch(e){on=true}
  const size=()=>{const dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};
  const mk=top=>{const flake=Math.random()<.65;return{x:Math.random()*W,y:top?Math.random()*H:-20,r:flake?5+Math.random()*6:1.2+Math.random()*2.4,flake,vy:.25+Math.random()*.5,sw:Math.random()*6.3,sws:.006+Math.random()*.014,rot:Math.random()*6,vr:(Math.random()-.5)*.012,o:.45+Math.random()*.35}};
  const drawFlake=f=>{x.save();x.translate(f.x,f.y);x.rotate(f.rot);
    for(const [w,col] of [[3.4,'rgba(115,189,224,.35)'],[1.4,'#fff']]){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();
      for(let k=0;k<6;k++){const a=k*Math.PI/3,ca=Math.cos(a),sa=Math.sin(a),b=f.r*.55,bl=f.r*.32;x.moveTo(0,0);x.lineTo(ca*f.r,sa*f.r);
        for(const sg of [-1,1]){const a2=a+sg*.75;x.moveTo(ca*b,sa*b);x.lineTo(ca*b+Math.cos(a2)*bl,sa*b+Math.sin(a2)*bl)}}x.stroke()}
    x.restore()};
  const tick=()=>{x.clearRect(0,0,W,H);
    for(const f of flakes){f.y+=f.vy;f.sw+=f.sws;f.x+=Math.sin(f.sw)*.45;f.rot+=f.vr;if(f.y>H+20)Object.assign(f,mk(false));
      x.globalAlpha=f.o;if(f.flake)drawFlake(f);else{x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=1;x.strokeStyle='rgba(115,189,224,.5)';x.stroke()}}
    x.globalAlpha=1;raf=requestAnimationFrame(tick)};
  const start=()=>{if(still)return;size();flakes=Array.from({length:W<700?12:26},()=>mk(true));c.style.display='';cancelAnimationFrame(raf);tick()};
  const stop=()=>{cancelAnimationFrame(raf);c.style.display='none'};
  addEventListener('resize',()=>{if(on&&!still)size()});
  if(on)start();else stop();
  return{get on(){return on},toggle(){on=!on;try{localStorage.setItem('mr-snow',on?'on':'off')}catch(e){}on?start():stop();toast(on?'Snow on ❄':'Snow off')}};
})();

  dm.onclick=async ev=>{const x=ev.target.dataset.x;if(!x)return;dm.remove();
    if(x==='export'){const data={app:'moodrobe',v:1,items:S.items,outfits:S.outfits,logs:S.logs,settings:Object.entries(S.settings).map(([id,value])=>({id,value}))};
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download=`moodrobe-${ymd(new Date())}.json`;a.click();}
    if(x==='import')$('#importFile').click();
    if(x==='snow')snowFx.toggle();
  };
};
document.addEventListener('click',e=>{const dm=$('.drop');if(dm&&!dm.contains(e.target))dm.remove()});
$('#importFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const data=JSON.parse(await f.text());if(!['moodrobe','dear-closet'].includes(data.app))throw new Error('ไม่ใช่ไฟล์สำรองของ moodrobe');
    if(!confirm('กู้คืนจะแทนที่ข้อมูลปัจจุบันทั้งหมด ดำเนินการต่อ?'))return;
    for(const s of ['items','outfits','logs','settings']){await idb.clear(s);for(const o of (data[s]||[]))await idb.put(s,o)}
    await boot();toast('Restored ✦ กู้คืนข้อมูลแล้ว');
  }catch(err){alert('กู้คืนไม่สำเร็จ: '+err.message)}
};

async function boot(){
  await idb.open();
  [S.items,S.outfits,S.logs]=await Promise.all(['items','outfits','logs'].map(s=>idb.all(s)));
  S.settings={};(await idb.all('settings')).forEach(r=>S.settings[r.id]=r.value);
  render();
}
boot().catch(e=>{$('#main').innerHTML=`<div class="wrap">${empty('Oops','something broke','เปิดฐานข้อมูลไม่ได้: '+esc(e.message))}</div>`});
</script>
</body>
</html>
